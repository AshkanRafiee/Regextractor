plugins { id 'com.android.application' }

android {
    namespace = 'com.ashkanrafiee.regextractor'
    compileSdk = 36
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    defaultConfig {
        applicationId = 'com.ashkanrafiee.regextractor'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.0.1'
    }
    dependenciesInfo { includeInApk = false; includeInBundle = false }

    def signingFile = rootProject.file('signing.properties')
    def signingValues = new Properties()
    if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
    def env = System.getenv()
    signingConfigs { release {
        if (signingValues['storeFile'] ?: env.REGEXTRACTOR_STORE_FILE) {
            storeFile rootProject.file(signingValues['storeFile'] ?: env.REGEXTRACTOR_STORE_FILE)
            storeType (signingValues['storeType'] ?: env.REGEXTRACTOR_STORE_TYPE ?: 'PKCS12')
            storePassword (signingValues['storePassword'] ?: env.REGEXTRACTOR_STORE_PASSWORD)
            keyAlias (signingValues['keyAlias'] ?: env.REGEXTRACTOR_KEY_ALIAS)
            keyPassword (signingValues['keyPassword'] ?: env.REGEXTRACTOR_KEY_PASSWORD)
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
        }
    } }
    buildTypes { release { if (signingValues['storeFile'] ?: env.REGEXTRACTOR_STORE_FILE) signingConfig signingConfigs.release; minifyEnabled false } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
